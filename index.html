<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Bible</title>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    :root {
      --bg: #ffffff;
      --bg2: #f7f7f5;
      --border: #e8e8e4;
      --text: #1a1a1a;
      --text2: #6b6b6b;
      --text3: #aaaaaa;
      --accent: #2c5f8a;
      --accent-light: #eaf1f8;
      --red: #c0392b;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    #header {
      display: flex;
      align-items: center;
      padding: 14px 16px 10px;
      border-bottom: 1px solid var(--border);
      gap: 10px;
      flex-shrink: 0;
      min-height: 52px;
    }
    #back-btn {
      display: none;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      border: none;
      background: none;
      cursor: pointer;
      color: var(--accent);
      flex-shrink: 0;
    }
    #back-btn svg { width: 20px; height: 20px; }
    #header-title {
      font-family: 'Lora', serif;
      font-size: 17px;
      font-weight: 500;
      color: var(--text);
      flex: 1;
    }
    #header-sub {
      font-size: 12px;
      color: var(--text3);
      font-weight: 300;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .view { display: none; flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
    .view.active { display: block; }
    .testament-label {
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text3);
      padding: 18px 16px 6px;
    }
    .book-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 13px 16px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: background 0.1s;
    }
    .book-item:active { background: var(--bg2); }
    .book-name { font-size: 15px; color: var(--text); }
    .book-abbr { font-size: 12px; color: var(--text3); margin-left: 8px; }
    .chevron svg { width: 14px; height: 14px; display: block; color: var(--text3); }
    #chapter-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
      padding: 16px;
    }
    .chapter-btn {
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 15px;
      color: var(--text);
      cursor: pointer;
      background: var(--bg);
      transition: background 0.1s, border-color 0.1s;
    }
    .chapter-btn:active {
      background: var(--accent-light);
      border-color: var(--accent);
      color: var(--accent);
    }
    #verse-content { padding: 20px 16px 40px; }
    .verse-row { display: flex; gap: 10px; margin-bottom: 14px; }
    .verse-num {
      font-size: 11px;
      font-weight: 500;
      color: var(--accent);
      min-width: 22px;
      padding-top: 3px;
      flex-shrink: 0;
      text-align: right;
    }
    .verse-text {
      font-family: 'Lora', serif;
      font-size: 16px;
      color: var(--text);
      line-height: 1.8;
    }
    .verse-text.red { color: var(--red); }
    .status {
      padding: 40px 16px;
      text-align: center;
      color: var(--text3);
      font-size: 14px;
    }
    .view::-webkit-scrollbar { width: 3px; }
    .view::-webkit-scrollbar-track { background: transparent; }
    .view::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
  </style>
</head>
<body>

  <div id="header">
    <button id="back-btn" onclick="goBack()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 18l-6-6 6-6"/>
      </svg>
    </button>
    <div>
      <div id="header-title">Bible</div>
      <div id="header-sub" id="translation-label">Loading…</div>
    </div>
  </div>

  <div id="view-books" class="view active">
    <div class="status">Loading…</div>
  </div>
  <div id="view-chapters" class="view">
    <div id="chapter-grid"></div>
  </div>
  <div id="view-verses" class="view">
    <div id="verse-content"><div class="status">Loading…</div></div>
  </div>

  <script>
    const API_KEY = 'QUxMlFIPVVlgQkFTRSBBUkUgQkVMT05HIFRPIFVT';
    const BASE    = 'https://api.scripture.api.bible/v1';
    const OT_BOOKS = 39;

    let BIBLE_ID = null;
    let BIBLE_NAME = '';
    let books = [];
    let state = { view: 'books', book: null };

    function h() { return { 'api-key': API_KEY }; }

    async function apiFetch(path) {
      const r = await fetch(BASE + path, { headers: h() });
      if (!r.ok) throw new Error(r.status);
      return (await r.json()).data;
    }

    // Find NASB (or best available English) from account's accessible bibles
    async function findBible() {
      const bibles = await apiFetch('/bibles');
      // Priority: NASB 2020, NASB, then any English
      const priority = ['NASB2020','NASB','nasb2020','nasb'];
      for (const abbr of priority) {
        const match = bibles.find(b => b.abbreviation === abbr || b.abbreviationLocal === abbr);
        if (match) return match;
      }
      // Fallback: search by name
      const nasbName = bibles.find(b => b.name && b.name.toLowerCase().includes('new american standard'));
      if (nasbName) return nasbName;
      // Last resort: first English bible
      return bibles.find(b => b.language && b.language.id === 'eng') || bibles[0];
    }

    function showView(name) {
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      document.getElementById('view-' + name).classList.add('active');
      document.getElementById('back-btn').style.display = name === 'books' ? 'none' : 'flex';
      state.view = name;
    }

    function goBack() {
      if (state.view === 'verses') {
        showView('chapters');
        setHeader(state.book.name, state.book.abbreviation);
      } else if (state.view === 'chapters') {
        showView('books');
        setHeader('Bible', BIBLE_NAME);
      }
    }

    function setHeader(title, sub) {
      document.getElementById('header-title').textContent = title;
      document.getElementById('header-sub').textContent = sub || BIBLE_NAME;
    }

    async function loadBooks() {
      try {
        const bible = await findBible();
        BIBLE_ID   = bible.id;
        BIBLE_NAME = bible.abbreviation || bible.name;
        document.getElementById('header-sub').textContent = BIBLE_NAME;

        books = await apiFetch(`/bibles/${BIBLE_ID}/books`);
        renderBooks();
      } catch(e) {
        document.getElementById('view-books').innerHTML =
          `<div class="status">Could not load. Check your connection.<br><small>${e.message}</small></div>`;
      }
    }

    function renderBooks() {
      const ot = books.slice(0, OT_BOOKS);
      const nt = books.slice(OT_BOOKS);
      const row = b => `<div class="book-item" onclick="selectBook('${b.id}')">
        <span><span class="book-name">${b.name}</span><span class="book-abbr">${b.abbreviation}</span></span>
        <span class="chevron"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></span>
      </div>`;
      document.getElementById('view-books').innerHTML =
        '<div class="testament-label">Old Testament</div>' + ot.map(row).join('') +
        '<div class="testament-label">New Testament</div>' + nt.map(row).join('');
    }

    async function selectBook(bookId) {
      state.book = books.find(b => b.id === bookId);
      setHeader(state.book.name, state.book.abbreviation);
      showView('chapters');
      document.getElementById('chapter-grid').innerHTML =
        '<div class="status" style="grid-column:1/-1">Loading…</div>';
      try {
        const chapters = await apiFetch(`/bibles/${BIBLE_ID}/books/${bookId}/chapters`);
        const real = chapters.filter(c => !c.id.endsWith('intro'));
        document.getElementById('chapter-grid').innerHTML = real.map(c =>
          `<div class="chapter-btn" onclick="selectChapter('${c.id}','${c.number}')">${c.number}</div>`
        ).join('');
      } catch(e) {
        document.getElementById('chapter-grid').innerHTML =
          '<div class="status" style="grid-column:1/-1">Could not load chapters.</div>';
      }
    }

    async function selectChapter(chapterId, chapterNum) {
      setHeader(state.book.name + ' ' + chapterNum, BIBLE_NAME);
      showView('verses');
      document.getElementById('verse-content').innerHTML = '<div class="status">Loading…</div>';
      try {
        const data = await apiFetch(
          `/bibles/${BIBLE_ID}/chapters/${chapterId}?content-type=json&include-notes=false&include-titles=false&include-chapter-numbers=false&include-verse-numbers=true&include-verse-spans=false`
        );
        renderVerses(data.content);
      } catch(e) {
        document.getElementById('verse-content').innerHTML =
          '<div class="status">Could not load verses.</div>';
      }
    }

    function renderVerses(content) {
      if (!content || !Array.isArray(content)) {
        document.getElementById('verse-content').innerHTML =
          '<div class="status">No content available.</div>';
        return;
      }

      let html = '';
      let currentVerse = '';
      let currentText = '';
      let isRed = false;

      function flush() {
        if (currentVerse && currentText.trim()) {
          html += `<div class="verse-row">
            <span class="verse-num">${currentVerse}</span>
            <span class="verse-text${isRed ? ' red' : ''}">${currentText.trim()}</span>
          </div>`;
          currentText = '';
          isRed = false;
        }
      }

      function walk(nodes) {
        if (!Array.isArray(nodes)) return;
        nodes.forEach(node => {
          if (!node) return;
          if (node.type === 'tag' && node.name === 'verse') {
            flush();
            currentVerse = node.attrs?.number || '';
            if (node.items) walk(node.items);
          } else if (node.type === 'tag' && node.name === 'wj') {
            isRed = true;
            if (node.items) walk(node.items);
            isRed = false;
          } else if (node.type === 'text') {
            currentText += node.text || '';
          } else if (node.items) {
            walk(node.items);
          }
        });
      }

      walk(content);
      flush();

      document.getElementById('verse-content').innerHTML =
        html || '<div class="status">No verses found.</div>';
    }

    loadBooks();
  </script>
</body>
</html>
